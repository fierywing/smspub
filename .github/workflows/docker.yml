# 构建多架构镜像并推送到 Docker Hub。
# 前置：仓库 Secrets 里配置 DOCKERHUB_USERNAME 与 DOCKERHUB_TOKEN
#（Docker Hub → Account Settings → Personal access tokens，权限 Read & Write）。
# 触发：push 到 main 或网页手动触发，构建后打 latest 标签。
name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QEMU + buildx：一次产出 amd64 和 arm64（树莓派等 ARM 机器可直接拉取）
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 镜像名直接用 Secret 里的用户名，仓库改名/换账号无需改本文件
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smspub:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
