# smspub 容器编排。
#
# 两个必须整目录挂载、不能挂单文件的地方：
#   1) /dev —— 串口经 USB hub 接入，重插后 ttyUSB 编号会整体重排，
#      且需要按设备号放行（实测三种写法只有这一种能真正 open 串口）：
#        -v /dev:/dev              仅挂载   → Operation not permitted
#        --device /dev:/dev        仅声明   → 容器内看不到 by-path 链接
#        -v /dev:/dev + cgroup 规则 → 可正常 open ✓（本文件采用）
#   2) conf/ —— 配置保存走「写 .tmp 再 rename」，单文件 bind mount 挂的是
#      inode，rename 会报 "device or resource busy"，容器内就存不了配置。
services:
  smspub:
    build: .
    image: smspub:local
    container_name: smspub
    restart: unless-stopped
    # Web 端口：改冒号左边的宿主机端口即可（容器内固定 8080，由 -listen 钉死）。
    ports:
      - "8080:8080"
    command: ["-c", "/app/conf/config.json", "-listen", ":8080"]
    volumes:
      # /dev 整挂，by-path 符号链接随宿主机实时变化，重插换号自动跟随。
      - /dev:/dev
      # conf/ 与 data/ 整目录挂载（见文件头 2），重启容器不丢配置与历史。
      - ./conf:/app/conf
      - ./data:/app/data
    # 放行 USB 串口设备的读写，按主设备号而非节点名授权：
    #   c 188:* —— ttyUSB*（usb-serial 驱动族，绝大多数 USB 模块，如 Quectel/移远）
    #   c 166:* —— ttyACM*（CDC-ACM 类，部分模块/开发板枚举为这种）
    # 次设备号通配，故 ttyUSB 编号重排、新插模块都无需改配置。
    # 若模块枚举为其他类型（如主板 RS232 的 ttyS*，主设备号 4），照格式加一行即可。
    device_cgroup_rules:
      - "c 188:* rwm"
      - "c 166:* rwm"
